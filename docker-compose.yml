services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: support_system_db
    environment:
      POSTGRES_USER: puneethkumarg
      POSTGRES_PASSWORD: NewStrongPassword
      POSTGRES_DB: ai_support_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: support_system_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery:
    build: .
    container_name: support_system_celery
    command: >
      celery
      -A app.core.celery_app.celery
      worker
      --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/support_system
      - ./uploads:/support_system/uploads
      - ./logs:/support_system/logs
    restart: unless-stopped

  app:
    build: .
    container_name: support_system
    env_file:
      - .env
    ports:
      - "8000:8000"

    depends_on:
      - redis
      - postgres
    
    volumes:
      - .:/support_system
      - ./uploads:/support_system/uploads
      - ./logs:/support_system/logs

    restart: unless-stopped

volumes:
  postgres_data: