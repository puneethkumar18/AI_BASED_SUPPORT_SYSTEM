

services:
  app:
    build: .
    container_name: support_system_api
    
    ports: 
      - "8000:8000"

    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis

    restart: unless-stopped

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  postgres:

    image: postgres:16-alpine

    container_name: support_system_db

    environment:
      POSTGRES_USER: puneethkumarg
      POSTGRES_PASSWORD: NewStrongPassword
      POSTGRES_DB: ai_support_system

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    restart: unless-stopped



  redis:

    image: redis:7-alpine
    container_name: support_system_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  
  celery:
    build: .
    container_name: support_system_celery
    command: >
      celery
      -A app.core.celery_app.celery
      worker
      --loglevel=info

    env_file:
      - .env
    
    depends_on:
      - redis
      - postgres

    
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    restart: unless-stopped
  
volumes:
  postgres_data: